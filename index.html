<style>
body{margin:0;background:#F5F3EE}
a{color:#121212}a:hover{color:#55524C}
.logo{mix-blend-mode:multiply}
.navlink{text-decoration:none;color:#121212}
.navlink:hover{color:#55524C;text-decoration:underline;text-underline-offset:6px}
.btn{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.btn-dark:hover{background:#33312D !important;color:#FFFFFF !important}
.btn-ghost:hover{background:#121212 !important;color:#F5F3EE !important}
.btn-light:hover{background:#E4E0D6 !important}
.chip{transition:background-color .15s ease,color .15s ease}
.chip:hover{border-color:#121212 !important}
.svc{transition:background-color .2s ease,color .2s ease,padding-left .2s ease}
.svc:hover{padding-left:28px !important}
.layer{transition:opacity .4s ease,fill-opacity .4s ease}
.field:focus{outline:2px solid #121212;outline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #121212;outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein .35s ease both}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes breeze{to{stroke-dashoffset:-36}}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
.breeze{stroke-dasharray:12 6;stroke-linecap:round;animation:breeze 2s linear infinite}
.breeze2{stroke-dasharray:3 8;stroke-linecap:round;animation:breeze 1.5s linear infinite}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes curl{to{transform:rotate(360deg)}}
.sway{animation:sway 1.8s ease-in-out infinite}
.sway2{animation:sway 2.4s ease-in-out infinite reverse}
.curl{transform-box:fill-box;transform-origin:center;animation:curl 3s linear infinite}
@keyframes drift{0%,100%{transform:translateX(-3px);opacity:.55}50%{transform:translateX(3px);opacity:1}}
.drift{animation:drift 2.6s ease-in-out infinite}
.streak{fill:none;stroke:#FFFFFF;stroke-opacity:.8;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:2 14;animation:breeze 1.6s linear infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .6s ease-out both}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-6px);opacity:1}}
.bounce{transform-box:fill-box;animation:bounce 1.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.6s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.drop{animation:drop .55s cubic-bezier(.2,.8,.2,1) both}
@media (max-width: 860px){#howScroll{height:820px !important}.howStage{margin-bottom:-820px !important}}
#howScroll::-webkit-scrollbar{width:6px}#howScroll::-webkit-scrollbar-thumb{background:#BDB8AD;border-radius:3px}
@media (prefers-reduced-motion: reduce){.rise,.fade,.flow,.breeze,.breeze2,.sway,.sway2,.curl,.drift,.streak,.grow,.bounce,.pop,.drop{animation:none}.draw{animation:none;stroke-dashoffset:0}.layer,.svc{transition:none}#howScroll{scroll-snap-type:none !important}}
</style>

</head>

<p style="margin: 0; font-size: 13px; color: #55524C">Scroll within this panel to step through, or pick a number.</p>
</div>
</section>

<!-- ABOUT -->
<section id="about" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 9vw, 120px) clamp(16px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 64px; align-items: start">
<img src="/_blob/2957b14413e681bfcef452399579dde2" alt="Milo Gillot with a rucksack at a limestone climbing crag above the sea" style="aspect-ratio: 4 / 5; width: 100%; max-width: 460px; object-fit: cover; display: block">
<div style="display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #55524C">About</p>
<h2 style="margin: 0; font-family: 'Abril Fatface', 'Bodoni 72', Didot, Georgia, serif; font-weight: 400; font-size: clamp(36px, 4.4vw, 60px); line-height: 1.05">My background</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3A3833; max-width: 34em">I studied Civil Engineering at the University of Bristol, graduating with an MEng, and I'm a Certified Passivhaus Designer. My work centres on building energy simulation: using accurate digital models to test how a building will perform before it's built, for new build and retrofit alike.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3A3833; max-width: 34em">I'm based in Ibiza and work on projects in both the UK and Spain, so I'm used to working to different regulations and climates. Away from work, you'll usually find me climbing.</p>
<dl style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 0 32px; border-top: 1px solid #121212">
<div style="padding: 16px 0; border-bottom: 1px solid #D9D5CC; display: flex; flex-direction: column; gap: 6px">
<dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #55524C">Qualifications</dt>
<dd style="margin: 0; font-size: 15px; line-height: 1.55">MEng Civil Engineering, University of Bristol<br>Certified Passivhaus Designer</dd>
</div>
<div style="padding: 16px 0; border-bottom: 1px solid #D9D5CC; display: flex; flex-direction: column; gap: 6px">
<dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #55524C">Software</dt>
<dd style="margin: 0; font-size: 15px; line-height: 1.55">IES VE, PHPP, Rhino, Grasshopper, Ladybug &amp; Honeybee</dd>
</div>
<div style="padding: 16px 0; border-bottom: 1px solid #D9D5CC; display: flex; flex-direction: column; gap: 6px">
<dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #55524C">Based in</dt>
<dd style="margin: 0; font-size: 15px; line-height: 1.55">Ibiza, Balearic Islands</dd>
</div>
<div style="padding: 16px 0; border-bottom: 1px solid #D9D5CC; display: flex; flex-direction: column; gap: 6px">
<dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #55524C">Projects in</dt>
<dd style="margin: 0; font-size: 15px; line-height: 1.55">United Kingdom and Spain</dd>
</div>
</dl>
</div>
</section>

<!-- CONTACT -->
<section id="contact" style="border-top: 1px solid #121212">
<div style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 9vw, 120px) clamp(16px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 56px">
<div style="display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #55524C">Contact</p>
<h2 style="margin: 0; font-family: 'Abril Fatface', 'Bodoni 72', Didot, Georgia, serif; font-weight: 400; font-size: clamp(40px, 5vw, 72px); line-height: 1.02; text-wrap: balance">Have a project in mind?</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #3A3833; max-width: 30em">Tell me a little about the site, the stage you're at and what you need, and I'll get back to you.</p>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; padding-top: 8px">
<a href="mailto:[your@email]" style="font-weight: 600; text-underline-offset: 6px">[your@email]</a>
<span style="color: #3A3833">[Phone]</span>
<span style="color: #3A3833">Ibiza, Balearic Islands</span>
</div>
</div>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div class="fade" role="status" style="display: flex; flex-direction: column; gap: 16px; justify-content: center; padding: 40px; border: 1.5px solid #121212; background: #FFFFFF">
<h3 style="margin: 0; font-family: 'Abril Fatface', Georgia, serif; font-weight: 400; font-size: 36px">Thank you.</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3A3833">Your enquiry has been sent. I'll reply as soon as I can.</p>
<div><button class="btn btn-ghost" type="button" onClick="{{reset}}" style="font: inherit; font-size: 14px; font-weight: 600; background: transparent; color: #121212; border: 1.5px solid #121212; padding: 12px 20px; min-height: 44px; cursor: pointer">Send another</button></div>
</div>
</sc-if>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<form aria-label="Project enquiry" onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 22px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; padding: 0 0 12px">What do you need help with?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{needs}}" as="n" hint-placeholder-count="7">
<button class="chip" type="button" onClick="{{n.toggle}}" aria-pressed="{{n.pressed}}" style="font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 10px 16px; border: 1.5px solid {{n.border}}; background: {{n.bg}}; color: {{n.fg}}; cursor: pointer">{{n.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-name" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em">Name</label>
<input class="field" id="f-name" name="name" type="text" autocomplete="name" style="font: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #121212; background: #FFFFFF; color: #121212; min-height: 48px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-email" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em">Email</label>
<input class="field" id="f-email" name="email" type="email" autocomplete="email" style="font: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #121212; background: #FFFFFF; color: #121212; min-height: 48px; box-sizing: border-box">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-loc" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em">Project location</label>
<input class="field" id="f-loc" name="location" type="text" style="font: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #121212; background: #FFFFFF; color: #121212; min-height: 48px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-scale" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em">Project type</label>
<select class="field" id="f-scale" name="scale" style="font: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #121212; background: #FFFFFF; color: #121212; min-height: 48px; box-sizing: border-box">
<option>Single home or extension</option>
<option>Retrofit of an existing building</option>
<option>Multi-residential scheme</option>
<option>Other</option>
</select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-msg" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em">About the project</label>
<textarea class="field" id="f-msg" name="message" rows="5" style="font: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #121212; background: #FFFFFF; color: #121212; resize: vertical; box-sizing: border-box"></textarea>
</div>
<div>
<button class="btn btn-dark" type="submit" style="font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; background: #121212; color: #F5F3EE; border: 0; padding: 16px 32px; min-height: 48px; cursor: pointer">Send enquiry</button>
</div>
</form>
</sc-if>
</div>
</section>

<!-- FOOTER -->
<footer style="border-top: 1px solid #D9D5CC">
<div style="max-width: 1200px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 48px) 48px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px">
<img class="logo" src="/_blob/d3019039e66ba58b28e8b389828798bc" alt="Gillot Designs" style="height: 44px; width: auto; display: block">
<div style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 13px; color: #55524C">
<span>© 2026 Gillot Designs · Milo Gillot</span>
<span>NIF [your NIF]</span>
<a href="#top" style="color: #55524C">Legal notice &amp; privacy</a>
</div>
</div>
</footer>

});

return {

}),

var el = e.currentTarget, h = Math.max(1, el.clientHeight), i = Math.floor((el.scrollTop + h * 0.45) / h);
i = Math.max(0, Math.min(3, i));
if (i !== self.state.howStep) self.setState({ howStep: i });
},

}
